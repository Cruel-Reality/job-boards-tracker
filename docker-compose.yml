# Local development services for job-boards-tracker.
# Start everything with:  docker compose up -d
# Stop with:              docker compose down   (add -v to also wipe the data volume)

services:
  # "db" is the service name. Compose uses it as the container's network hostname
  # and as the label you pass to commands, e.g. `docker compose logs db`.
  db:
    # The read-only image this container is built from, pulled from Docker Hub.
    # Pinning ":16" (not ":latest") keeps the Postgres major version reproducible.
    image: postgres:16

    # A stable container name so `docker ps` / `docker exec` are predictable.
    container_name: job_tracker_db

    # Environment variables the postgres image reads ON FIRST STARTUP to create
    # the initial role and database. These must line up with DATABASE_URL in .env:
    #   postgresql+psycopg://job_user:devpassword@localhost:5432/job_tracker
    environment:
      POSTGRES_USER: job_user
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: job_tracker

    # Port mapping is "HOST:CONTAINER". This publishes the container's internal
    # 5432 to localhost:5432 on your machine, which is why DATABASE_URL can say
    # @localhost:5432. Without this line the DB would be unreachable from the host.
    ports:
      - "5432:5432"

    # A named volume persists Postgres's data dir outside the container's lifecycle,
    # so `docker compose down` (without -v) keeps your data; the container is
    # disposable, the volume is not.
    volumes:
      - pgdata:/var/lib/postgresql/data

    # Healthcheck lets Compose (and later, the api service) know when Postgres is
    # actually ready to accept connections, not just when the process has started.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_user -d job_tracker"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The FastAPI backend, built from our own Dockerfile (contrast with db's
  # prebuilt image: our app's code lives only here, so no public image exists).
  api:
    build: .
    container_name: job_tracker_api

    # Don't start until the db's healthcheck passes, so migrations on boot don't
    # race a database that isn't accepting connections yet.
    depends_on:
      db:
        condition: service_healthy

    # Inside compose, services reach each other by service name. The db is at
    # host "db", not "localhost" (localhost in a container is the container itself).
    # This overrides the localhost value in .env, which is for running on the host.
    environment:
      DATABASE_URL: postgresql+psycopg://job_user:devpassword@db:5432/job_tracker

    # HOST:CONTAINER. Publishes the API on localhost:8000 for the browser/frontend.
    ports:
      - "8000:8000"

    # Override the Dockerfile's CMD: apply migrations first, then serve. This is
    # what lets `docker compose up` work against a brand-new database in one step.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

# Top-level declaration of the named volume referenced above. Docker manages where
# this lives on disk; you refer to it only by the name "pgdata".
volumes:
  pgdata:
